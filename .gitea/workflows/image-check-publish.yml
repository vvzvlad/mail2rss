name: Docker Image CI

# No `pull_request` trigger on purpose: a PR build would push :latest, which
# watchtower auto-deploys to prod.
on:
  workflow_dispatch:
  push:
    branches: [ "main", "develop" ]

permissions:
  contents: read   # checkout

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"   # same as the Dockerfile base image

    - name: Install dependencies
      run: pip install -r requirements-dev.txt

    - name: Run tests
      env:
        # src/settings.py validates these at import time, so the test job must
        # provide them. All three are PLACEHOLDERS — none is a real credential.
        FASTMAIL_API_TOKEN: ci-placeholder-not-a-real-token
        # Fake, but syntactically valid: 26 lowercase base32 chars, no padding
        # (128 bits) — the startup format check rejects anything else.
        MAIL2RSS_SECRET: ci7fake7secret7not7real7za
        BASE_URL: https://rss.example.com
      run: pytest --tb=short -q

  build:
    runs-on: ubuntu-latest
    needs: test                          # no green tests → no image is built
    steps:
    - uses: actions/checkout@v7

    - name: Log in to the Gitea container registry
      uses: docker/login-action@v3
      with:
        registry: gitea.vvzvlad.xyz
        username: ${{ github.repository_owner }}
        # Org-level secret on `projects`; the built-in GITEA_TOKEN has no
        # package scope and cannot push images.
        password: ${{ secrets.REGISTRY_TOKEN }}

    - name: Compute image tags
      id: tags
      # main -> :latest + :<sha> (watchtower deploys :latest); develop -> :develop only
      run: |
        if [ "${{ github.ref_name }}" = "main" ]; then
          echo "tags=gitea.vvzvlad.xyz/${{ github.repository }}:latest gitea.vvzvlad.xyz/${{ github.repository }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
        else
          echo "tags=gitea.vvzvlad.xyz/${{ github.repository }}:develop" >> "$GITHUB_OUTPUT"
        fi

    - name: Build the Docker image
      run: |
        tag_args=""
        for tag in ${{ steps.tags.outputs.tags }}; do tag_args="$tag_args --tag $tag"; done
        docker build . --file Dockerfile $tag_args

    - name: Push Docker images
      run: |
        for tag in ${{ steps.tags.outputs.tags }}; do docker push "$tag"; done
